; The firmware of the optional USB dongle (a LilyGO T-Dongle-S3): see README.md.
[platformio]
default_envs = t-dongle-s3

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = arduino
board = t-dongle-s3
; TinyUSB (USB-OTG) mode: the dongle is a keyboard, a mouse and a serial port at once.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
